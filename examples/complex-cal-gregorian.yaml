id: gregorian
name: Gregorian Calendar
epochGregorian: "0000-01-01"
type: rule-based
delimiter: "-" # e.g., 2026-07-14

ruleBasedDetails:
  daysInStandardYear: 365
  leapYearRule:
    ruleType: gregorian # Triggers the divisible by 4, but not 100 unless 400 math
    applyToMonthIndex: 1 # February
  months:
    - { name: "January", days: 31 }
    - { name: "February", days: 28 }
    - { name: "March", days: 31 }
    - { name: "April", days: 30 }
    - { name: "May", days: 31 }
    - { name: "June", days: 30 }
    - { name: "July", days: 31 }
    - { name: "August", days: 31 }
    - { name: "September", days: 30 }
    - { name: "October", days: 31 }
    - { name: "November", days: 30 }
    - { name: "December", days: 31 }
