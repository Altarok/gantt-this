name: Deploy Docs to GitHub Pages

on:
  workflow_dispatch:  # manual trigger; add 'push' if you want auto-deploy too
  # inputs: {}      # optional: add manual inputs if you like

permissions: { }

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      # Download and prepare Kiln binary (CI-only, no repo changes)
      - name: Setup Kiln
        run: |
          set -euo pipefail
          KILN_VERSION="v0.9.5" # Replace with exact target version
          KILN_SHA256="141c31a490dfd82452183f60189f7c7f108d359c7d0a8394d929ecf42369a7a5"
          
          curl -sSL -o kiln "https://github.com/otaleghani/kiln/releases/download/${KILN_VERSION}/kiln_linux_amd64"
          echo "${KILN_SHA256}  kiln" | sha256sum -c -
          chmod +x kiln

      # Build site from ./docs into ./public
      - name: Build Site
        run: |
          ./kiln generate \
            --input ./docs \
            --output ./public \
            --url "https://Altarok.github.io/gantt-this"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ./public

  deploy:
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        # https://github.com/actions/deploy-pages/commit/cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
